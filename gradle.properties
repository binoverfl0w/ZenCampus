org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# One version for every app. Release tags are v<version>; the Android versionCode must grow with every release.
zencampus.version=0.1.0
zencampus.versionCode=1
# Release configuration, blank in development builds; the release workflow sets them.
# The environment variables ZENCAMPUS_UPDATE_REPO and ZENCAMPUS_CRASH_DSN override these.
# GitHub repository (owner/name) whose latest release the apps offer as an update.
zencampus.updateRepo=
# Sentry-compatible DSN (Sentry or GlitchTip) that receives crash reports from users who opt in.
zencampus.crashDsn=
