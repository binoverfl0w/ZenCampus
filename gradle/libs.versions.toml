[versions]
kotlin = "2.2.21"
compose = "1.9.3"
agp = "8.11.1"
ktor = "3.2.3"
coroutines = "1.10.2"
serialization = "1.9.0"
datetime = "0.7.1"
sqldelight = "2.1.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
sql-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sql-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sql-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.16.0" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.10.1" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version = "2.9.2" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
espresso = { module = "androidx.test.espresso:espresso-core", version = "3.6.1" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
