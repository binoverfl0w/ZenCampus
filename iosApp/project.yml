name: ZenCampus
options:
  preGenCommand: ./prepare-project.sh
  deploymentTarget:
    iOS: '17.2'
configs:
  Debug: debug
  Release: release
settings:
  configs:
    Debug:
      ZEN_HOST_BUNDLE_ID: io.github.binoverfl0w.zencampus.dev
      ZEN_WIDGET_GROUP: group.io.github.binoverfl0w.zencampus.dev
    Release:
      ZEN_HOST_BUNDLE_ID: io.github.binoverfl0w.zencampus
      ZEN_WIDGET_GROUP: group.io.github.binoverfl0w.zencampus
targets:
  ZenCampus:
    type: application
    platform: iOS
    sources:
      - ZenCampus.swift
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      - Localization
    dependencies:
      - target: ZenCampusWidgets
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: ZenCampus
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_VERSION: '5.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(CONFIGURATION_BUILD_DIR)'
        OTHER_LDFLAGS: '$(inherited) -framework ZenShared -lsqlite3 -lc++'
        OTHER_LDFLAGS[sdk=iphonesimulator*]: '$(inherited) -framework ZenShared -lsqlite3 -lc++ -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $(SRCROOT)/build/SimulatorEntitlements-$(CONFIGURATION).plist'
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: SimulatorEntitlements.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ZEN_UPDATE_REPOSITORY: ''
        ZEN_CRASH_DSN: ''
        PRODUCT_BUNDLE_IDENTIFIER: $(ZEN_HOST_BUNDLE_ID)
    preBuildScripts:
      - name: Build Kotlin framework
        script: '"${SRCROOT}/build-framework.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Copy Compose resources
        script: '"${SRCROOT}/copy-resources.sh"'
        basedOnDependencyAnalysis: false
  ZenCampusWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "*.plist"
      - path: ../androidApp/src/main/res/font
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Widgets/WidgetInfo.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(ZEN_HOST_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Entitlements.plist
        OTHER_LDFLAGS[sdk=iphonesimulator*]: '$(inherited) -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker $(SRCROOT)/build/SimulatorAppGroup-$(CONFIGURATION).plist'
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES
        SWIFT_VERSION: '5.0'
